name: Tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:  # yamllint disable-line rule:truthy
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly rebuild so the "main" images track MNE-Python's development version
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      tags:
        description: 'MNE-Python version (e.g. v1.13.2 or main)'
        required: false
        default: 'main'

permissions:
  contents: read
  packages: write

env:
  PUSH: ${{ github.repository == 'mne-tools/mne-docker' && github.event_name != 'pull_request' }}

jobs:
  # Build and test natively on each architecture, then push arch-suffixed tags
  docker:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      docker_tag: ${{ steps.vars.outputs.docker_tag }}
      push_latest: ${{ steps.vars.outputs.push_latest }}
    steps:
      - uses: actions/checkout@v7
      - name: Set env vars
        id: vars
        run: |
          set -eo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Pushing a tag like v1.13.2 builds that release and updates "latest"
            MNE_VERSION="${{ github.ref_name }}"
            PUSH_LATEST=true
          elif [[ "${{ github.event.inputs.tags }}" != "" ]]; then
            MNE_VERSION="${{ github.event.inputs.tags }}"
            PUSH_LATEST=false
          else
            MNE_VERSION=main
            PUSH_LATEST=false
          fi
          echo "MNE_VERSION=${MNE_VERSION}" >> "$GITHUB_ENV"
          echo "DOCKER_TAG=${MNE_VERSION}" >> "$GITHUB_ENV"
          echo "docker_tag=${MNE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "push_latest=${PUSH_LATEST}" >> "$GITHUB_OUTPUT"
          echo "Got MNE_VERSION=${MNE_VERSION}"
          echo "Got PUSH_LATEST=${PUSH_LATEST}"
      - run: docker compose build --build-arg mne_v="$MNE_VERSION"
      - name: System info - base image
        run: docker run ghcr.io/mne-tools/mne-python python -c "import mne; mne.sys_info()"
      - name: Run base test
        run: docker run -v "$(pwd)":/opt/app/examples ghcr.io/mne-tools/mne-python python /opt/app/examples/tests/base.py
      - name: System info - jupyter image
        run: docker run ghcr.io/mne-tools/mne-python-jupyter ipython -c "import mne; mne.sys_info()"
      - name: Run jupyter test
        run: docker run -v "$(pwd)":/opt/app/examples ghcr.io/mne-tools/mne-python-jupyter ipython /opt/app/examples/tests/base.py
      - name: System info - plot image
        run: docker run ghcr.io/mne-tools/mne-python-plot python -c "import mne; mne.sys_info()"
      - name: Run plotting test
        run: docker run -v "$(pwd)":/opt/app/examples ghcr.io/mne-tools/mne-python-plot python /opt/app/examples/tests/plot.py
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: env.PUSH == 'true'
      - name: Push images to github
        run: |
          set -exo pipefail
          for name in mne-python mne-python-jupyter mne-python-plot; do
            docker tag "ghcr.io/mne-tools/${name}" "ghcr.io/mne-tools/${name}:${DOCKER_TAG}-${{ matrix.arch }}"
            docker push "ghcr.io/mne-tools/${name}:${DOCKER_TAG}-${{ matrix.arch }}"
          done
        if: env.PUSH == 'true'

  # Combine the per-arch images into multi-arch tags
  manifest:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'mne-tools/mne-docker' && github.event_name != 'pull_request'
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifests
        run: |
          set -exo pipefail
          DOCKER_TAG="${{ needs.docker.outputs.docker_tag }}"
          for name in mne-python mne-python-jupyter mne-python-plot; do
            image="ghcr.io/mne-tools/${name}"
            tags=(-t "${image}:${DOCKER_TAG}")
            if [[ "${{ needs.docker.outputs.push_latest }}" == "true" ]]; then
              tags+=(-t "${image}:latest")
            fi
            docker buildx imagetools create "${tags[@]}" "${image}:${DOCKER_TAG}-amd64" "${image}:${DOCKER_TAG}-arm64"
          done
