services:

  # Images

  base:
    build:
      context: ./base
      dockerfile: Dockerfile
    image: ghcr.io/mne-tools/mne-python

  jupyter:
    build:
      context: ./base
      dockerfile: Dockerfile.jupyter
      additional_contexts:
        base: service:base
    image: ghcr.io/mne-tools/mne-python-jupyter

  plot:
    build:
      context: ./base
      dockerfile: Dockerfile.plot
      additional_contexts:
        jupyter: service:jupyter
    image: ghcr.io/mne-tools/mne-python-plot

  # Dask

  scheduler:
    image: ghcr.io/mne-tools/mne-python
    hostname: mne-dask-scheduler
    ports:
      - "8786:8786"
      - "8787:8787"
    command: ["dask", "scheduler"]

  worker:
    depends_on:
      - scheduler
    image: ghcr.io/mne-tools/mne-python
    hostname: mne-dask-worker
    command: ["dask", "worker", "tcp://scheduler:8786"]

  worker-plot:
    depends_on:
      - scheduler
    image: ghcr.io/mne-tools/mne-python-plot
    hostname: mne-dask-worker-plot
    command: ["dask", "worker", "tcp://scheduler:8786"]
